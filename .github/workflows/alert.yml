name: WTI Oil Alert

on:
  schedule:
    - cron: '*/15 * * * *'  # siatka bezpieczeństwa: wskrzesza łańcuch, gdyby się urwał
  workflow_dispatch:
  repository_dispatch:
    types: [poll-price]

permissions:
  contents: write

concurrency:
  group: oil-alert
  cancel-in-progress: false  # nie zabijaj trwającego polla; nadmiarowe runy kolejkują się do 1

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Poll price (WTI)
        continue-on-error: true  # awaria źródła nie może zerwać łańcucha
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python alert.py
      - name: Monitor Hormuz crossings (~20 min)
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python hormuz.py
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no state change"; exit 0
          fi
          # snapshot our freshly-computed state, then rebuild on top of remote WITHOUT a 3-way
          # merge — reset --hard + overlay can never produce conflict markers (the old autostash
          # pop did, which corrupted the JSON and silently killed both alerts).
          cp state.json /tmp/s.json
          [ -f hormuz_state.json ] && cp hormuz_state.json /tmp/h.json || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            git reset -q --hard origin/main
            cp /tmp/s.json state.json
            [ -f /tmp/h.json ] && cp /tmp/h.json hormuz_state.json || true
            git add -A
            if git diff --staged --quiet; then
              echo "state already current on remote"; exit 0
            fi
            git commit -q -m "state: $(date -u +%FT%TZ)"
            if git push -q origin main; then
              echo "pushed (attempt $i)"; exit 0
            fi
            echo "push race, retry $i"
          done
          echo "WARN: could not push state after retries"
      - name: Chain next poll (~2 min)
        if: always()  # łańcuch ciągnie się nawet, gdyby wcześniejszy krok padł
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 100
          gh api --method POST "/repos/${{ github.repository }}/dispatches" -f event_type=poll-price
