name: WTI Oil Alert

# Poll co 15 min BEZ lokalnego PC:
# jeden job trzyma runner ~6h i w pętli sprawdza cenę co 15 min.
# schedule co 4h restartuje łańcuch (GHA cron bywa opóźniony — pętla to omija).
on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: "Wyślij przykładowy alert (bez zmiany state)"
        type: boolean
        default: false
      once:
        description: "Tylko jeden poll (bez pętli 15 min)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: oil-alert-poll
  # nowy schedule kasuje stary job i startuje świeżą pętlę 6h
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Poll (once or every 15 min for ~6h)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SAMPLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sample || 'false' }}
          # schedule zawsze pętla; ręcznie: once=true (domyślnie) = 1 poll, once=false = pętla 6h
          RUN_LOOP: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.once == 'false') }}
        run: |
          set -euo pipefail
          chmod +x scripts/push_state.sh

          poll_once() {
            echo "=== poll $(date -u +%FT%TZ) ==="
            git fetch -q origin main || true
            git reset -q --hard origin/main
            python alert.py
            bash scripts/push_state.sh
          }

          if [[ "${SAMPLE}" =~ ^(1|true|yes)$ ]]; then
            python alert.py
            echo "SAMPLE done (state nie ruszany)"
            exit 0
          fi

          if [[ "${RUN_LOOP}" != "true" ]]; then
            poll_once
            exit 0
          fi

          # pętla ~5h 50m (timeout joba = 6h); co 15 min — PC niepotrzebny
          DEADLINE=$((SECONDS + 5 * 3600 + 50 * 60))
          n=0
          while (( SECONDS < DEADLINE )); do
            n=$((n + 1))
            echo ">>> iteration $n  elapsed=${SECONDS}s"
            poll_once || echo "WARN: poll_once exit $? — kontynuuję pętlę"
            remaining=$((DEADLINE - SECONDS))
            if (( remaining < 60 )); then
              echo "deadline near — stop loop"
              break
            fi
            sleep_for=900
            if (( remaining < sleep_for + 30 )); then
              sleep_for=$((remaining - 30))
            fi
            if (( sleep_for > 0 )); then
              echo "sleep ${sleep_for}s until next poll"
              sleep "$sleep_for"
            fi
          done
          echo "loop finished after $n iterations"
