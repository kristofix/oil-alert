name: WTI Oil Alert

on:
  schedule:
    - cron: '0 5,13,20 * * *'  # 07:00, 15:00, 22:00 PL (CEST=UTC+2); zimą zmień na 0 6,14,21
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Poll price (WTI)
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python alert.py
      - name: Monitor Hormuz crossings
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python hormuz.py
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no state change"; exit 0
          fi
          cp state.json /tmp/s.json
          [ -f hormuz_state.json ] && cp hormuz_state.json /tmp/h.json || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            git reset -q --hard origin/main
            cp /tmp/s.json state.json
            [ -f /tmp/h.json ] && cp /tmp/h.json hormuz_state.json || true
            git add -A
            if git diff --staged --quiet; then
              echo "state already current on remote"; exit 0
            fi
            git commit -q -m "state: $(date -u +%FT%TZ)"
            if git push -q origin main; then
              echo "pushed (attempt $i)"; exit 0
            fi
            echo "push race, retry $i"
          done
          echo "WARN: could not push state after retries"
