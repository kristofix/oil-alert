name: WTI Oil Alert

# Maksymalna niezawodność bez lokalnego PC:
# 1) pętla co 15 min przez ~5h50m na runnerze GHA
# 2) na końcu / przy failure → self-chain (POLL_PAT)
# 3) schedule co godzinę jako backup bootstrap
# 4) osobny watchdog (watchdog.yml) pilnuje luk
on:
  schedule:
    # gęsty bootstrap — GHA i tak bywa opóźniony; pętla + chain nadrabia
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: "Wyślij przykładowy alert (bez zmiany state)"
        type: boolean
        default: false
      once:
        description: "Tylko jeden poll (bez pętli 15 min)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

# Ręczny "once/sample" NIE ubija długiej pętli (osobna grupa concurrency)
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.once == 'true' || github.event.inputs.sample == 'true')) && format('oil-alert-once-{0}', github.run_id) || 'oil-alert-poll' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (github.event.inputs.once == 'true' || github.event.inputs.sample == 'true')) }}

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Poll (once or every 15 min for ~6h)
        id: poll
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SAMPLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sample || 'false' }}
          RUN_LOOP: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.once == 'false') }}
        run: |
          set -euo pipefail
          chmod +x scripts/push_state.sh

          poll_once() {
            echo "=== poll $(date -u +%FT%TZ) ==="
            git fetch -q origin main || true
            git reset -q --hard origin/main
            python alert.py
            bash scripts/push_state.sh
          }

          if [[ "${SAMPLE}" =~ ^(1|true|yes)$ ]]; then
            python alert.py
            echo "SAMPLE done (state nie ruszany)"
            echo "mode=sample" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${RUN_LOOP}" != "true" ]]; then
            poll_once
            echo "mode=once" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=loop" >> "$GITHUB_OUTPUT"

          # pętla ~5h 50m; co 15 min
          DEADLINE=$((SECONDS + 5 * 3600 + 50 * 60))
          n=0
          failures=0
          while (( SECONDS < DEADLINE )); do
            n=$((n + 1))
            echo ">>> iteration $n  elapsed=${SECONDS}s"
            if poll_once; then
              failures=0
            else
              failures=$((failures + 1))
              echo "WARN: poll_once fail #$failures"
              # po 5 z rzędu twardych failach — wyjdź (chain/watchdog podniosą)
              if (( failures >= 5 )); then
                echo "ERROR: 5 consecutive poll failures"
                exit 1
              fi
            fi
            remaining=$((DEADLINE - SECONDS))
            if (( remaining < 60 )); then
              echo "deadline near — stop loop (will chain)"
              break
            fi
            sleep_for=900
            if (( remaining < sleep_for + 30 )); then
              sleep_for=$((remaining - 30))
            fi
            if (( sleep_for > 0 )); then
              echo "sleep ${sleep_for}s until next poll"
              sleep "$sleep_for"
            fi
          done
          echo "loop finished after $n iterations"

      # Natychmiastowy restart łańcucha (nie czeka na zawodny cron GHA)
      - name: Chain next loop
        if: always() && !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.once == 'false' && github.event.inputs.sample != 'true'))
        env:
          GH_TOKEN: ${{ secrets.POLL_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WARN: brak secrets.POLL_PAT — polegamy na schedule/watchdog"
            exit 0
          fi
          # mały jitter żeby nie bić API w tej samej sekundzie
          sleep $((RANDOM % 15 + 5))
          for attempt in 1 2 3 4 5; do
            if gh workflow run alert.yml --repo "${{ github.repository }}" -f once=false -f sample=false; then
              echo "chained next loop (attempt $attempt)"
              exit 0
            fi
            echo "chain failed attempt $attempt, retry..."
            sleep $((attempt * 20))
          done
          echo "ERROR: could not chain next loop"
          exit 1

      - name: Telegram on job failure
        if: failure() && !cancelled()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail
          msg="⚠️ *oil-alert* job FAILED
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          event: \`${{ github.event_name }}\`
          (watchdog / chain spróbuje podnieść)"
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${msg}" \
            --data-urlencode "parse_mode=Markdown" \
            >/dev/null || echo "WARN: TG failure notify failed"
