name: WTI Oil Alert

on:
  schedule:
    # poll co 15 min; TG tylko przy |Δ| ≥ $1 (logika w alert.py)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: "Wyślij przykładowy alert (bez zmiany state)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check price + maybe alert
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SAMPLE: ${{ github.event.inputs.sample || 'false' }}
        run: python alert.py
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no state change"; exit 0
          fi
          cp state.json /tmp/s.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            git reset -q --hard origin/main
            cp /tmp/s.json state.json
            git add -A
            if git diff --staged --quiet; then
              echo "state already current on remote"; exit 0
            fi
            git commit -q -m "state: $(date -u +%FT%TZ)"
            if git push -q origin main; then
              echo "pushed (attempt $i)"; exit 0
            fi
            echo "push race, retry $i"
          done
          echo "WARN: could not push state after retries"
